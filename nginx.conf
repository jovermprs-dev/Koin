server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # expo-sqlite's web backend (wa-sqlite) needs SharedArrayBuffer, which
    # browsers only expose on a cross-origin-isolated page. `credentialless`
    # isolates the page without requiring every cross-origin resource
    # (fonts, Supabase requests) to opt in with its own CORP header.
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;

    # Expo Router's static export ships one .html file per route
    # ((tabs)/index.html, login.html, ...). Fall back to index.html for
    # any path that doesn't match a prerendered file, so client-side
    # navigation and direct deep links both work.
    location / {
        try_files $uri $uri.html $uri/index.html /index.html;
    }
}
