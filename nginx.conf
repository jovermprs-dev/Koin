server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Expo Router's static export ships one .html file per route
    # ((tabs)/index.html, login.html, ...). Fall back to index.html for
    # any path that doesn't match a prerendered file, so client-side
    # navigation and direct deep links both work.
    location / {
        try_files $uri $uri.html $uri/index.html /index.html;
    }
}
