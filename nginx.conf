server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed build output (filename changes on every build) — safe to
    # cache indefinitely.
    location /_expo/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Browsers keep a favicon-specific cache that doesn't reliably respect
    # normal HTTP caching, so this asks it to never reuse a stored copy
    # without a full re-fetch — the closest a server can get to
    # cache-busting a URL that expo-router hardcodes (no query strings).
    location = /favicon.ico {
        add_header Cache-Control "no-store";
    }

    # Single-page app: every path serves the same shell, and expo-router
    # handles routing client-side. index.html must always be revalidated
    # so a deploy is visible on the next load, not just after a hard
    # refresh.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
