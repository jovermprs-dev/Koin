services:
  koin-web:
    build:
      context: .
      args:
        EXPO_PUBLIC_SUPABASE_URL: ${EXPO_PUBLIC_SUPABASE_URL}
        EXPO_PUBLIC_SUPABASE_ANON_KEY: ${EXPO_PUBLIC_SUPABASE_ANON_KEY}
    container_name: koin-web
    restart: unless-stopped
    volumes:
      # Built APKs live outside the git-synced app tree so a normal
      # deploy (which mirrors the repo with --delete) never touches
      # them. Serving the physical file needs no nginx config beyond
      # what's already there: `try_files $uri ...` under `location /`
      # serves a real file before falling back to the SPA shell.
      - /home/sergio/downloads/koin:/usr/share/nginx/html/download:ro
    networks:
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.koin.rule=Host(`koin.sergiojover.dev`)"
      - "traefik.http.routers.koin.entrypoints=websecure"
      - "traefik.http.routers.koin.tls.certresolver=letsencrypt"
      - "traefik.http.services.koin.loadbalancer.server.port=80"

networks:
  web:
    external: true
